<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plantas | NEXORA AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<style>
.planta{padding:18px;cursor:pointer}
.planta .cab{display:flex;justify-content:space-between;align-items:center}
.planta h3{font-size:14.5px}
.planta .n{font-size:10.5px;color:var(--mut)}
.pas{margin-top:12px;display:flex;flex-direction:column;gap:0}
.pas .p{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;padding:7px 0;position:relative}
.pas .p::before{content:"";position:absolute;left:11px;top:26px;bottom:-4px;width:1.5px;background:var(--borda)}
.pas .p:last-child::before{display:none}
.pas .bola{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--borda-forte);display:grid;place-items:center;font-size:10px;color:#fff;flex-shrink:0;cursor:pointer;z-index:1;background:var(--card)}
.pas .bola.on{background:var(--grad);border-color:transparent}
.pas .p.feito{opacity:.55}
.pas .p.feito span{text-decoration:line-through}
</style>
</head>
<body data-pagina="plantas.html">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gradRing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c026d3"/><stop offset="1" stop-color="#a23cff"/></linearGradient>
</defs></svg>

<header class="topbar" id="topbar" data-onde="Plantas"></header>

<div class="shell">
  <aside class="side" id="sidebar"></aside>

  <main class="dmain">
    <div class="pagehead">
      <h1>Plantas</h1>
      <p>Planos de estudo passo a passo que a NEXORA monta para o seu objetivo.</p>
      <div class="acoes"><button class="btn btn-pri" data-modal="modal-planta">+ Nova planta</button></div>
    </div>

    <section class="grid" id="grid-plantas"></section>
  </main>
</div>

<div class="modal-fundo" id="modal-planta" role="dialog" aria-modal="true">
  <div class="modal">
    <h3>Criar nova planta</h3>
    <p>Diga o seu objetivo e a NEXORA monta um plano com etapas, aulas e prompts sugeridos.</p>
    <input class="notas" id="planta-obj" style="width:100%;background:var(--card-2);border:1px solid var(--borda);border-radius:10px;padding:11px 13px;margin-top:14px;outline:none" placeholder="Ex.: aprender a automatizar relatórios com IA">
    <div class="acoes">
      <button class="btn btn-sec" data-fechar>Cancelar</button>
      <button class="btn btn-pri" id="btn-planta">Criar planta</button>
    </div>
  </div>
</div>

<script src="assets/layout.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/app.js"></script>
<script>
(function(){
  const PLANTAS = [
    { t:'Do zero ao primeiro agente', obj:'Automação', etapas:[
      ['Fundamentos da Inteligência Artificial','Módulos 1 e 2',2],
      ['Engenharia de Prompts na Prática','Módulo completo',1],
      ['Automação com IA','Módulos 1 e 3',0]
    ]},
    { t:'Conteúdo que converte', obj:'Marketing', etapas:[
      ['Criação de Conteúdo com IA','Módulos 1 e 2',1],
      ['Prompts de copywriting','Guardar 5 prompts',0],
      ['Marketing no piloto automático','Workshop ao vivo',0]
    ]},
    { t:'IA no dia a dia do trabalho', obj:'Produtividade', etapas:[
      ['ChatGPT para Produtividade','Curso completo',1],
      ['Guias: e-mails e resumos','3 guias',2],
      ['Criar o seu segundo cérebro','Projeto final',0]
    ]}
  ];

  function render(){
    document.getElementById('grid-plantas').innerHTML = PLANTAS.map((p,pi) => {
      const total = p.etapas.reduce((s,e)=>s+e[2],0);
      const tudo = p.etapas.reduce((s,e)=>s+e[2].length,0);
      return `
      <article class="card planta">
        <div class="cab">
          <div><h3>${p.t}</h3><span class="n">Objetivo: ${p.obj}</span></div>
          <span class="nivel-pill intermedio">${total}/${tudo}</span>
        </div>
        <div class="pas" data-planta="${pi}">
          ${p.etapas.map((e,ei)=>`<div class="p ${e[2]?'feito':''}"><button class="bola ${e[2]?'on':''}" data-p="${pi}" data-e="${ei}">${e[2]?'✓':''}</button><div><b style="color:#fff;font-size:12.5px;font-weight:600">${e[0]}</b><br><span style="font-size:11px;color:var(--mut)">${e[1]}</span></div></div>`).join('')}
        </div>
      </article>`;
    }).join('');
  }
  render();

  document.getElementById('grid-plantas').addEventListener('click', e => {
    const b = e.target.closest('.bola');
    if (!b) return;
    const p = PLANTAS[+b.dataset.p], ei = +b.dataset.e;
    p.etapas[ei][2] = p.etapas[ei][2] ? '' : '✓';
    if (p.etapas[ei][2]) { window.toast('Etapa concluída! +20 XP'); window.confete(); }
    render();
  });

  document.getElementById('btn-planta').addEventListener('click', () => {
    const v = document.getElementById('planta-obj').value.trim();
    if (!v) return window.toast('Descreva o seu objetivo', 'err');
    PLANTAS.unshift({ t:v.slice(0,48), obj:v.slice(0,30), etapas:[['Escolher as aulas certas','sugerido pela IA',0],['Praticar com prompts','3 sessões',0],['Construir um projeto real','entrega final',0]] });
    document.getElementById('planta-obj').value='';
    document.getElementById('modal-planta').classList.remove('aberto');
    window.toast('Planta criada! A NEXORA está a montar as etapas…');
    render();
  });
})();
</script>
</body>
</html>
