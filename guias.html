<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guias e tutoriais | AI Edu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<style>
.guia{display:flex;gap:15px;padding:16px 18px;background:linear-gradient(180deg,var(--card-2),var(--card));border:1px solid var(--borda);border-radius:var(--raio);transition:var(--trans);align-items:flex-start}
.guia:hover{border-color:rgba(200,140,255,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 0 26px rgba(255,255,255,.08),0 0 22px rgba(255,45,138,.35),0 7px 0 #1f0e25,0 22px 44px -12px rgba(0,0,0,.7);transform:translateY(-2px)}
.guia .ico{width:42px;height:42px;border-radius:11px;background:rgba(255,45,138,.15);display:grid;place-items:center;font-size:18px;flex-shrink:0}
.guia h3{font-size:14px}
.guia p{font-size:12px;color:var(--mut);margin-top:4px;line-height:1.5}
.guia .passos{font-size:10.5px;color:var(--pri-soft);font-weight:700;margin-top:7px;display:block}
</style>
</head>
<body data-pagina="guias.html">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gradRing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c026d3"/><stop offset="1" stop-color="#a23cff"/></linearGradient>
</defs></svg>

<header class="topbar" id="topbar" data-onde="Guias e tutoriais"></header>

<div class="shell">
  <aside class="side" id="sidebar"></aside>

  <main class="dmain">
    <div class="pagehead">
      <h1>Guias e tutoriais</h1>
      <p>Passo a passo curtos para resolver tarefas reais com IA hoje.</p>
    </div>

    <div class="filtros" id="filtros-guias">
      <button class="chip ativo" data-valor="Todos">Todos</button>
      <button class="chip" data-valor="Básico">Básico</button>
      <button class="chip" data-valor="Trabalho">Trabalho</button>
      <button class="chip" data-valor="Avançado">Avançado</button>
    </div>

    <section class="grid-2" id="grid-guias" aria-live="polite"></section>
    <div class="vazio" id="vazio-guias" hidden><span class="ico">🔍</span>Nenhum guia nesta categoria com essa pesquisa.</div>
  </main>
</div>

<script src="assets/layout.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/app.js"></script>
<script>
(function(){
  const D = window.DEMO;
  let estado = { cat:'Todos', q:'' };
  const GUIAS = [
    { t:'Escrever e-mails que recebem resposta', d:'Estrutura de 4 blocos com revisão final feita por IA antes de enviar.', cat:'Trabalho', passos:6, min:8, ico:'✉️' },
    { t:'Resumir um PDF de 40 páginas', d:'Extraia decisões, números e riscos em 3 camadas: resumo, detalhe e citações.', cat:'Trabalho', passos:5, min:11, ico:'📄' },
    { t:'Criar a sua primeira automação', d:'Conecte um formulário a uma IA e receba o resultado por e-mail.', cat:'Básico', passos:7, min:14, ico:'⚡' },
    { t:'Melhorar um prompt ruim', d:'Antes e depois: diagnostique falhas e reescreva com papel, contexto e formato.', cat:'Básico', passos:4, min:7, ico:'🩺' },
    { t:'Agente que monitora concorrentes', d:'Um agente com ferramentas de busca que envia relatório semanal.', cat:'Avançado', passos:9, min:22, ico:'🛰️' },
    { t:'Padronizar a voz da marca', d:'Crie um guia de estilo que qualquer modelo segue ao escrever pela empresa.', cat:'Avançado', passos:8, min:19, ico:'🏷️' }
  ];

  function render(){
    const lista = GUIAS.filter(g =>
      (estado.cat==='Todos' || g.cat===estado.cat) &&
      (g.t+g.d+g.cat).toLowerCase().includes(estado.q)
    );
    document.getElementById('vazio-guias').hidden = lista.length>0;
    document.getElementById('grid-guias').innerHTML = lista.map(g => `
      <article class="guia">
        <div class="ico">${g.ico}</div>
        <div style="flex:1">
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><h3>${g.t}</h3><span class="nivel-pill ${g.cat.toLowerCase()==='avançado'?'avancado':g.cat.toLowerCase()==='trabalho'?'intermedio':'iniciante'}">${g.cat}</span></div>
          <p>${g.d}</p>
          <span class="passos">→ ${g.passos} passos · ~${g.min} min</span>
        </div>
        <button class="btn btn-sec" style="flex-shrink:0;align-self:center" data-abrir-guia="${g.t}">Abrir</button>
      </article>`).join('');
  }
  document.addEventListener('click', e => { const b=e.target.closest('[data-abrir-guia]'); if(b) window.toast('Abrindo guia: '+b.dataset.abrirGuia); });
  document.addEventListener('filtro:mudou', e => { if (e.detail.grupo==='filtros-guias'){ estado.cat=e.detail.valor; render(); } });
  document.addEventListener('busca:mudou', e => { estado.q=e.detail.q; render(); });
  render();
})();
</script>
</body>
</html>
