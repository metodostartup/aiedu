<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — AI Edu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07040c; --card:rgba(17,7,23,.92); --line:rgba(162,60,255,.22);
  --pri:#c026d3; --pri-soft:#a23cff; --laranja:#ff7a18; --magenta:#ff2d8a;
  --grad:linear-gradient(110deg,#ff7a18,#ff2d8a 48%,#a23cff);
  --txt:#f3eef8; --muted:#9a86ad;
  --r:14px; --shadow:0 24px 60px rgba(0,0,0,.55);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;display:grid;place-items:center;padding:24px;
  font-family:'Inter',sans-serif;color:var(--txt);background:var(--bg);overflow-x:hidden;
}
/* brilho de fundo */
body::before,body::after{content:'';position:fixed;border-radius:50%;filter:blur(120px);opacity:.5;pointer-events:none}
body::before{width:540px;height:540px;background:#3d0a5c;top:-160px;left:-120px;animation:flutuar 14s ease-in-out infinite alternate}
body::after{width:460px;height:460px;background:#5c1230;bottom:-160px;right:-100px;animation:flutuar 17s ease-in-out infinite alternate-reverse}
@keyframes flutuar{to{transform:translate(50px,36px) scale(1.12)}}

.wrap{position:relative;width:100%;max-width:420px;z-index:1}

/* anel de neon atrás do card */
.anel{position:absolute;inset:-3px;border-radius:calc(var(--r) + 3px);background:conic-gradient(from var(--a,0deg),var(--pri),var(--laranja),var(--pri-soft),var(--magenta),var(--pri));filter:blur(14px);opacity:.55;animation:girar 7s linear infinite;z-index:0}
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes girar{to{--a:360deg}}

.card{position:relative;z-index:1;background:var(--card);backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:var(--r);padding:38px 34px;box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.07)}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px;text-decoration:none}
.logo .badge{width:38px;height:38px;border-radius:11px;background:var(--grad);display:grid;place-items:center;font-size:18px;color:#fff;box-shadow:0 6px 18px rgba(192,38,211,.5)}
.logo b{font-family:'Sora',sans-serif;font-size:20px;letter-spacing:-.4px}
h1{font-family:'Sora',sans-serif;font-size:23px;text-align:center;margin:16px 0 4px;letter-spacing:-.4px}
.sub{text-align:center;color:var(--muted);font-size:13.5px;margin-bottom:26px}

label{display:block;font-size:12.5px;font-weight:600;color:#d9cfe3;margin:14px 0 6px;letter-spacing:.2px}
.campo{position:relative}
.campo input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(162,60,255,.25);border-radius:10px;color:var(--txt);font:15px 'Inter';padding:13px 14px;outline:none;transition:border-color .18s, box-shadow .18s}
.campo input::placeholder{color:#6b5879}
.campo input:focus{border-color:var(--pri-soft);box-shadow:0 0 0 3px rgba(162,60,255,.18)}
.ver{position:absolute;top:50%;right:10px;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;padding:6px}
.ver:hover{color:var(--txt)}

.botao{width:100%;margin-top:22px;border:none;border-radius:10px;padding:14px;font:700 15px 'Sora',sans-serif;color:#fff;background:var(--grad);cursor:pointer;box-shadow:0 10px 26px rgba(192,38,211,.4);transition:transform .15s, box-shadow .15s, filter .15s}
.botao:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(192,38,211,.55);filter:brightness(1.06)}
.botao:active{transform:translateY(0)}
.botao:disabled{opacity:.6;cursor:wait;transform:none}
.botao:focus-visible,.ver:focus-visible,input:focus-visible{outline:2px solid #e6c8ff;outline-offset:2px}

.trocar{text-align:center;margin-top:18px;font-size:13px;color:var(--muted)}
.trocar a{color:#d9a8ff;font-weight:600;text-decoration:none}
.trocar a:hover{text-decoration:underline}

.aviso{display:none;margin-top:16px;padding:11px 13px;border-radius:10px;font-size:13px;line-height:1.45}
.aviso.erro{display:block;background:rgba(255,45,138,.1);border:1px solid rgba(255,45,138,.35);color:#ffb3d1}
.aviso.ok{display:block;background:rgba(80,220,140,.1);border:1px solid rgba(80,220,140,.35);color:#a9ecc8}

.voltar{display:block;text-align:center;margin-top:22px;color:var(--muted);font-size:12.5px;text-decoration:none}
.voltar:hover{color:var(--txt)}
.perfis-note{margin-top:14px;text-align:center;font-size:11.5px;color:#6b5879}

@media (max-width:420px){.card{padding:30px 22px}h1{font-size:20px}}
@media (prefers-reduced-motion:reduce){.anel,body::before,body::after{animation:none}}
</style>
</head>
<body>
<main class="wrap">
  <div class="anel" aria-hidden="true"></div>
  <section class="card">
    <a class="logo" href="/"><img src="assets/logo-aiedu.png" alt="AI Edu" style="height:22px;width:auto"></a>
    <h1 id="titulo">Bem-vindo de volta</h1>
    <p class="sub" id="sub">Entre para continuar sua jornada de IA</p>

    <form id="form" novalidate>
      <label for="email">E-mail</label>
      <div class="campo"><input id="email" type="email" autocomplete="email" placeholder="voce@email.com" required></div>

      <label for="senha">Senha</label>
      <div class="campo">
        <input id="senha" type="password" autocomplete="current-password" placeholder="••••••••" minlength="6" required>
        <button type="button" class="ver" id="ver" aria-label="Mostrar senha">mostrar</button>
      </div>

      <button class="botao" id="btn" type="submit">Entrar</button>
    </form>

    <div class="aviso" id="aviso" role="alert"></div>

    <p class="trocar" id="trocar">Ainda não tem conta? <a href="#" id="link-trocar">Criar conta grátis</a></p>
    <a class="voltar" href="/">← Voltar para o site</a>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/supabase-client.js"></script>
<script>
(function(){
'use strict';
var form=document.getElementById('form'),
    email=document.getElementById('email'),
    senha=document.getElementById('senha'),
    btn=document.getElementById('btn'),
    aviso=document.getElementById('aviso'),
    titulo=document.getElementById('titulo'),
    sub=document.getElementById('sub'),
    trocar=document.getElementById('trocar'),
    linkTrocar=document.getElementById('link-trocar'),
    modo='entrar'; // ou 'criar'

if (typeof supabase === 'undefined' || !window.NEXORA_CONFIG || window.NEXORA_CONFIG.anonKey.indexOf('AQUI') !== -1){
  mostrar('Configuração do Supabase ausente em assets/config.js.', 'erro');
  btn.disabled = true;
}
var client = supabase.createClient(window.NEXORA_CONFIG.url, window.NEXORA_CONFIG.anonKey);

// já autenticado → segue direto
client.auth.getUser().then(function(r){
  if (r && r.data && r.data.user) seguir(r.data.user);
});

function mostrar(msg, tipo){ aviso.textContent=msg; aviso.className='aviso '+tipo; }
function limpar(){ aviso.className='aviso'; aviso.textContent=''; }

document.getElementById('ver').addEventListener('click', function(){
  senha.type = senha.type==='password' ? 'text' : 'password';
  this.textContent = senha.type==='password' ? 'mostrar' : 'ocultar';
});

linkTrocar.addEventListener('click', function(e){
  e.preventDefault(); limpar();
  if (modo==='entrar'){
    modo='criar';
    titulo.textContent='Criar sua conta';
    sub.textContent='Comece hoje a dominar as habilidades de IA';
    this.textContent='Já tenho conta — entrar';
    btn.textContent='Criar conta';
    senha.setAttribute('autocomplete','new-password');
  } else {
    modo='entrar';
    titulo.textContent='Bem-vindo de volta';
    sub.textContent='Entre para continuar sua jornada de IA';
    this.textContent='Criar conta grátis';
    btn.textContent='Entrar';
    senha.setAttribute('autocomplete','current-password');
  }
});

form.addEventListener('submit', function(e){
  e.preventDefault(); limpar();
  if (!email.value.trim() || senha.value.length < 6){
    return mostrar('Informe um e-mail válido e uma senha de pelo menos 6 caracteres.', 'erro');
  }
  btn.disabled = true;
  var p = (modo==='entrar')
    ? client.auth.signInWithPassword({ email: email.value.trim(), password: senha.value })
    : client.auth.signUp({ email: email.value.trim(), password: senha.value, options:{ data:{ nome: email.value.split('@')[0] } } });

  p.then(function(r){
    btn.disabled = false;
    if (r.error){ mostrar(r.error.message, 'erro'); return; }
    if (modo==='criar' && !r.data.session){
      mostrar('Conta criada! Confirme o e-mail enviado para '+email.value.trim()+' e faça login.', 'ok');
      return;
    }
    seguir(r.data.user);
  }).catch(function(err){ btn.disabled=false; mostrar('Falha de conexão: '+err.message, 'erro'); });
});

function seguir(user){
  btn.textContent='Carregando…'; btn.disabled=true;
  client.from('perfis').select('papel').eq('id', user.id).single()
    .then(function(r){
      location.href = (r && r.data && r.data.papel==='admin') ? 'admin.html' : 'cinema.html';
    });
}
})();
</script>
</body>
</html>
