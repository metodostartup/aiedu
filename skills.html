<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skills | NEXORA AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<style>
.skill-card{padding:20px}
.skill-head{display:flex;gap:13px;align-items:center}
.skill-head .ico{width:46px;height:46px;border-radius:13px;background:rgba(255,45,138,.15);display:grid;place-items:center;font-size:20px;flex-shrink:0}
.skill-head h3{font-size:15px}
.skill-head span{font-size:11.5px;color:var(--mut)}
.dom-bloco{margin-top:14px}
.dom-bloco .linha{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-bottom:5px}
.dom-bloco .linha b{color:var(--pri-soft)}
.skill-rodape{display:flex;gap:9px;margin-top:14px;align-items:center}
.skill-rodape .btn{flex:1;justify-content:center}
</style>
</head>
<body data-pagina="skills.html">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gradRing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c026d3"/><stop offset="1" stop-color="#a23cff"/></linearGradient>
</defs></svg>

<header class="topbar" id="topbar" data-onde="Skills"></header>

<div class="shell">
  <aside class="side" id="sidebar"></aside>

  <main class="dmain">
    <div class="pagehead">
      <h1>Skills de IA</h1>
      <p>Competências que você desenvolve com trilhas de aulas e prática.</p>
    </div>

    <section class="grid" id="grid-skills"></section>
  </main>
</div>

<script src="assets/layout.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/app.js"></script>
<script>
(function(){
  const rotulo = d => d>=80?'Avançado':d>=40?'Intermédio':'Iniciante';
  document.getElementById('grid-skills').innerHTML = window.DEMO.skills.map(s => `
    <article class="card skill-card">
      <div class="skill-head">
        <div class="ico">${s.ico}</div>
        <div><h3>${s.nome}</h3><span>${s.aulas} aulas nesta skill</span></div>
      </div>
      <p style="margin-top:11px">${s.desc}</p>
      <div class="dom-bloco">
        <div class="linha"><span>Seu domínio</span><b>${s.dominio}% · ${rotulo(s.dominio)}</b></div>
        <div class="barra"><i style="width:${s.dominio}%"></i></div>
      </div>
      <div class="skill-rodape">
        <a class="btn btn-pri" href="cursos.html">Treinar skill</a>
        <button class="btn btn-sec btn-fav" aria-label="Guardar skill" aria-pressed="false">♡</button>
      </div>
    </article>`).join('');
})();
</script>
</body>
</html>
